name: Secure Build Pipeline

on:
  pull_request:
    branches: [ main ]
    
jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
  build:
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: |
          cd rbpo
          mvn clean package -DskipTests
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: rbpo/target/*.jar

  sast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run SpotBugs
        run: |
          cd rbpo
          mvn spotbugs:check

  dependency-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache OWASP Dependency-Check data
      uses: actions/cache@v4
      with:
        path: ~/.dependency-check
        key: dependency-check-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          dependency-check-${{ runner.os }}-

    - name: OWASP Dependency-Check
      run: |
          cd rbpo
          mvn dependency-check:check -DretireJsAnalyzerEnabled=false -DdataDirectory=$HOME/.dependency-check -DossindexAnalyzerEnabled=false
          
  container-security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: .
      - name: Build Docker image
        run: |
          ls -la
          docker build -f Dockerfile -t app:test .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app:test'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  dast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: .
      - name: Start Spring Boot app
        run: |
          java -jar *.jar &
          sleep 30
        continue-on-error: true
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'http://localhost:8080'
          continue-on-error: true
          
  web-fuzzing:
    needs: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: .
      - name: Start Spring Boot app
        run: |
          java -jar *.jar &
          sleep 30
      - name: Fuzz with feroxbuster
        run: |
          curl -sL https://raw.githubusercontent.com/epi052/feroxbuster/main/install-nix.sh | bash
          ./feroxbuster --url http://localhost:8080 -w /usr/share/wordlists/dirb/common.txt -t 10
        continue-on-error: true
        
  security-check:
    needs: [sast, dast, web-fuzzing]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Security gates summary
        run: |
          echo "=== SECURITY CHECK RESULTS ==="
          echo "SAST:            ${{ needs.sast.result }}"
          echo "DAST:            ${{ needs.dast.result }}"
          echo "Web Fuzzing:     ${{ needs.web-fuzzing.result }}"
