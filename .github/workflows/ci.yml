name: Secure Build Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml

  build:
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn clean package -DskipTests
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: target/*.jar

  sast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run SpotBugs
        run: mvn spotbugs:check

  dependency-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: OWASP Dependency-Check
        run: mvn dependency-check:check -DretireJsAnalyzerEnabled=false

  container-security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t app:test .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app:test'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  dast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Spring Boot app
        run: |
          java -jar target/*.jar &
          sleep 30
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'http://localhost:8080'

  web-fuzzing:
    needs: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Spring Boot app
        run: |
          java -jar target/*.jar &
          sleep 30
      - name: Install wfuzz and fuzz
        run: |
          pip install wfuzz
          wfuzz -c -z file,/usr/share/wordlists/dirb/common.txt --hc 404 http://localhost:8080/FUZZ

  security-check:
    needs: [sast, dast, web-fuzzing]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Security gates summary
        run: |
          echo "SAST: ${{ needs.sast.result }}"
          echo "DAST: ${{ needs.dast.result }}"
          echo "Web Fuzzing: ${{ needs.web-fuzzing.result }}"
