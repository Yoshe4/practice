name: Secure Build Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  # 1. Сканирование секретов (первый обязательный шаг)
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml

  # 2. Сборка (ждёт успеха secrets-scan)
  build:
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn clean package -DskipTests
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: target/*.jar

  # 3. SAST (ждёт build)
  sast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run SpotBugs
        run: mvn spotbugs:check

  # 4. Dependency Scan (уже есть в pom.xml, просто вызываем)
  dependency-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Dependency Check
        run: mvn dependency-check:check -DretireJsAnalyzerEnabled=false

  # 5. Container Security (ждёт build, нужен Dockerfile)
  container-security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t app:test .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app:test'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # 6. DAST (ждёт build, динамический анализ)
  dast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Spring Boot app
        run: |
          java -jar target/*.jar &
          sleep 30  # Spring Boot нужно больше времени
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'http://localhost:8080'

  # 7. Web Fuzzing (ждёт dependency-scan, как по заданию)
  web-fuzzing:
    needs: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Spring Boot app
        run: |
          java -jar target/*.jar &
          sleep 30
      - name: Fuzz with wfuzz
        run: |
          pip install wfuzz
          wfuzz -c -z file,/usr/share/wordlists/dirb/common.txt --hc 404 http://localhost:8080/FUZZ

  # 8. Финальная проверка (ждёт sast, dast, web-fuzzing)
  security-check:
    needs: [sast, dast, web-fuzzing]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Security gates summary
        run: |
          echo "=== SECURITY CHECK RESULTS ==="
          echo "SAST:            ${{ needs.sast.result }}"
          echo "DAST:            ${{ needs.dast.result }}"
          echo "Web Fuzzing:     ${{ needs.web-fuzzing.result }}"
          echo ""
          if [ "${{ needs.sast.result }}" != "success" ] || \
             [ "${{ needs.dast.result }}" != "success" ] || \
             [ "${{ needs.web-fuzzing.result }}" != "success" ]; then
            echo "❌ SECURITY CHECKS FAILED"
            exit 1
          else
            echo "✅ ALL SECURITY CHECKS PASSED"
          fi
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            target/dependency-check-report.html
            target/spotbugsXml.xml
          retention-days: 7
