name: Secure Build Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────────────────
  # 1. Сканирование секретов (первый гейт)
  # ──────────────────────────────────────────────────────
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml

  # ──────────────────────────────────────────────────────
  # 2. Сборка (ждёт secrets-scan)
  # ──────────────────────────────────────────────────────
  build:
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn clean package -DskipTests
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: target/*.jar

  # ──────────────────────────────────────────────────────
  # 3. SAST (статический анализ кода)
  # ──────────────────────────────────────────────────────
  sast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run SpotBugs
        run: mvn spotbugs:check

  # ──────────────────────────────────────────────────────
  # 4. Сканирование зависимостей
  # ──────────────────────────────────────────────────────
  dependency-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: OWASP Dependency-Check
        run: mvn org.owasp:dependency-check-maven:check

  # ──────────────────────────────────────────────────────
  # 5. Контейнерная безопасность
  # ──────────────────────────────────────────────────────
  container-security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t app:test .
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app:test'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # ──────────────────────────────────────────────────────
  # 6. DAST (динамический анализ)
  # ──────────────────────────────────────────────────────
  dast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start application
        run: |
          java -jar target/*.jar &
          sleep 10
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          target: 'http://localhost:8080'

  # ──────────────────────────────────────────────────────
  # 7. Веб-фаззинг (ждёт dependency-scan)
  # ──────────────────────────────────────────────────────
  web-fuzzing:
    needs: dependency-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start application
        run: |
          java -jar target/*.jar &
          sleep 10
      - name: Fuzz with wfuzz
        run: |
          pip install wfuzz
          wfuzz -c -z file,/usr/share/wordlists/dirb/common.txt --hc 404 http://localhost:8080/FUZZ

  # ──────────────────────────────────────────────────────
  # 8. Финальная проверка безопасности
  # ──────────────────────────────────────────────────────
  security-check:
    needs: [sast, dast, web-fuzzing]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Security gate status
        run: |
          echo "Все проверки безопасности завершены"
          echo "sast: ${{ needs.sast.result }}"
          echo "dast: ${{ needs.dast.result }}"  
          echo "web-fuzzing: ${{ needs.web-fuzzing.result }}"
